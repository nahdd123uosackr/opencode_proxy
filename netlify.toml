[build]
  functions = "api"

[functions]
  node_bundler = "esbuild"
  included_files = ["api/**"]

# 모든 API 요청 및 헬스체크를 api/index.js로 라우팅
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/index"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, x-api-key, anthropic-version, x-opencode-session, x-proxy-key"
